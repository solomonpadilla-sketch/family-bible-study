<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Bible Study</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#49067c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* brand constants (same in both themes) */
    --deep: #29093d;
    --lime: #dbe65b;
    --banana: #f7cc51;
    --turquoise: #0ab1b4;
    --tangerine: #e73722;
    --green: #3cb847;
    /* light theme (default) */
    --bg1: #ece4f7;
    --bg2: #faf7ff;
    --card: #ffffff;
    --ink: #3a2953;
    --heading: #29093d;
    --soft: #7a5da3;
    --faint: rgba(41,9,61,0.45);
    --line: rgba(41,9,61,0.14);
    --chip: rgba(41,9,61,0.05);
    --panel: rgba(41,9,61,0.06);
    --toolbar: rgba(255,255,255,0.97);
    --track: rgba(41,9,61,0.12);
    --sel: rgba(219,230,91,0.5);
    --label: #a8790f;
    --doneink: #71800e;
    --shadow: 0 10px 34px rgba(60,20,110,0.12);
  }
  body.dark {
    --bg1: #2c146c;
    --bg2: #590083;
    --card: rgba(255,255,255,0.07);
    --ink: #ffffff;
    --heading: #ffffff;
    --soft: #dfa5f7;
    --faint: rgba(255,255,255,0.5);
    --line: rgba(255,255,255,0.16);
    --chip: rgba(255,255,255,0.07);
    --panel: rgba(12,2,9,0.3);
    --toolbar: rgba(31,9,56,0.96);
    --track: rgba(255,255,255,0.12);
    --sel: rgba(219,230,91,0.16);
    --label: #f7cc51;
    --doneink: #dbe65b;
    --shadow: 0 10px 34px rgba(12,2,9,0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .icon {
    width: 1.05em;
    height: 1.05em;
    vertical-align: -0.18em;
    display: inline-block;
  }
  body {
    font-family: 'Nunito Sans', 'Avenir Next', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(350deg, var(--bg1), var(--bg2)) fixed;
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 60px; }

  header {
    text-align: center;
    padding: 34px 16px 18px;
  }
  header { position: relative; }
  header h1 {
    font-family: 'Montserrat', 'Nunito Sans', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--heading);
    letter-spacing: 0.3px;
  }
  .theme-toggle {
    position: absolute;
    top: 14px;
    right: 12px;
    padding: 7px 11px;
  }
  header h1 .cross { color: var(--banana); }
  header .sub {
    color: var(--soft);
    font-size: 0.9rem;
    margin-top: 6px;
  }

  .tabs {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 14px 0 24px;
  }
  .tabs button {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 11px 22px;
    border: 2px solid var(--line);
    border-radius: 100px;
    background: var(--chip);
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .tabs button:hover { border-color: var(--lime); }
  .tabs button.active {
    background: var(--lime);
    border-color: var(--lime);
    color: var(--deep);
  }

  .datebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 8px;
  }
  .datebar .when { text-align: center; flex: 1; }
  .datebar .when .big { font-size: 1.05rem; font-weight: 700; color: var(--heading); }
  .datebar .when .small { font-size: 0.8rem; color: var(--soft); }
  .navbtn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    border: 2px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    border-radius: 100px;
    padding: 6px 16px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .navbtn:hover { border-color: var(--lime); }
  .todaybtn { font-size: 0.8rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 28px 26px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .theme-label {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--label);
    margin-bottom: 4px;
  }
  .card h2 {
    font-family: 'Montserrat', 'Nunito Sans', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--heading);
    margin-bottom: 14px;
  }
  .verse-box {
    background: linear-gradient(135deg, rgba(121,86,236,0.95), rgba(47,185,248,0.95));
    border-radius: 18px;
    padding: 18px 20px;
    margin: 14px 0;
    font-style: italic;
    color: #fff;
  }
  .verse-box .ref {
    display: block;
    font-style: normal;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--banana);
    margin-top: 8px;
  }
  .body-text { margin: 14px 0; }
  h3.section {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--soft);
    margin: 22px 0 8px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 5px;
    font-weight: 800;
  }
  ol.questions { padding-left: 22px; }
  ol.questions li { margin-bottom: 9px; }
  .prayer {
    font-style: italic;
    color: var(--soft);
  }
  .readings-note {
    font-size: 0.82rem;
    font-style: italic;
    color: var(--soft);
    margin-bottom: 6px;
  }
  .readings { list-style: none; }
  .readings li {
    padding: 10px 0;
    border-bottom: 1px dotted var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .readings li:last-child { border-bottom: none; }
  .readings .what { color: var(--soft); font-size: 0.85rem; }
  .readbtn {
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    border: 2px solid var(--turquoise);
    background: none;
    color: var(--ink);
    border-radius: 100px;
    padding: 4px 14px;
    cursor: pointer;
    transition: background .15s;
  }
  .readbtn:hover { background: var(--turquoise); color: #fff; }
  .passage-text {
    display: none;
    width: 100%;
    background: var(--panel);
    border-radius: 14px;
    padding: 12px 14px;
    margin-top: 8px;
    font-size: 0.92rem;
    max-height: 420px;
    overflow-y: auto;
  }
  .pt-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    position: sticky;
    top: -12px;
    background: var(--toolbar);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .pt-hint { font-size: 0.75rem; font-style: italic; color: var(--soft); }
  .pt-toolbar .readbtn:disabled { opacity: 0.45; cursor: default; }
  .pt-verse {
    display: block;
    padding: 5px 8px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    line-height: 1.55;
  }
  .pt-verse:hover { background: var(--chip); }
  .pt-verse.sel {
    background: var(--sel);
    box-shadow: inset 3px 0 0 var(--lime);
  }
  .vnum {
    color: var(--label);
    font-size: 0.68rem;
    vertical-align: super;
    margin-right: 5px;
  }
  .activity {
    background: rgba(247,204,81,0.12);
    border: 2px dashed var(--banana);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 8px 0;
  }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 10px;
  }
  .complete-btn {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    padding: 11px 24px;
    border-radius: 100px;
    border: 2px solid var(--lime);
    background: var(--lime);
    color: var(--deep);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .complete-btn.done {
    background: transparent;
    color: var(--doneink);
  }
  .streak {
    font-size: 0.85rem;
    color: var(--soft);
  }
  .streak b { color: var(--label); }
  .printbtn {
    font-family: inherit;
    font-size: 0.8rem;
    border: none;
    background: none;
    color: var(--soft);
    cursor: pointer;
    text-decoration: underline;
  }
  .note {
    text-align: center;
    font-size: 0.75rem;
    color: var(--faint);
    font-style: italic;
    margin-top: 8px;
  }
  .quiz-q { margin: 18px 0 10px; font-weight: 800; }
  .quiz-q .qnum {
    display: inline-block;
    background: var(--turquoise);
    color: #fff;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    line-height: 24px;
    text-align: center;
    font-size: 0.85rem;
    margin-right: 8px;
    font-weight: 700;
  }
  .opts { display: flex; flex-direction: column; gap: 8px; margin-left: 32px; }
  .opt {
    font-family: inherit;
    font-size: 1rem;
    text-align: left;
    padding: 11px 16px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--chip);
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s;
  }
  .opt:hover { border-color: var(--lime); }
  .opt.correct { background: var(--green); border-color: var(--green); color: #fff; }
  .opt.wrong { background: var(--tangerine); border-color: var(--tangerine); color: #fff; }
  .opt:disabled { cursor: default; opacity: 0.75; }
  .opt.correct:disabled, .opt.wrong:disabled { opacity: 1; }
  .score-banner {
    text-align: center;
    background: rgba(247,204,81,0.15);
    border: 2px solid var(--banana);
    border-radius: 18px;
    padding: 14px;
    margin: 20px 0 6px;
    font-size: 1.1rem;
  }
  .score-banner .stars { font-size: 1.5rem; letter-spacing: 4px; }
  .retry-btn {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    margin-top: 8px;
    border: 2px solid var(--line);
    background: none;
    color: var(--ink);
    border-radius: 100px;
    padding: 5px 16px;
    cursor: pointer;
  }
  .retry-btn:hover { border-color: var(--lime); }
  .confetti-piece {
    position: fixed;
    top: -40px;
    z-index: 999;
    pointer-events: none;
    animation: conffall 2.9s linear forwards;
  }
  .confetti-piece svg { width: 100%; height: 100%; }
  @keyframes conffall {
    to { transform: translateY(110vh) rotate(540deg); opacity: 0.5; }
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--soft);
  }
  .progress-row .progress-label { min-width: 150px; }
  .progress-row .bar {
    flex: 1;
    height: 8px;
    border-radius: 100px;
    background: var(--track);
    overflow: hidden;
  }
  .progress-row .fill {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, var(--turquoise), var(--lime));
  }
  .toolrow { display: flex; gap: 8px; align-items: center; }
  .mem-words { margin: 12px 0 4px; line-height: 2.2; }
  .mem-chip {
    display: inline-block;
    margin: 2px;
    padding: 5px 10px;
    border-radius: 10px;
    background: var(--chip);
    border: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
  }
  .mem-chip.veiled {
    background: var(--panel);
    color: var(--soft);
    cursor: pointer;
    letter-spacing: 1px;
    border: 1px dashed var(--line);
  }
  .mem-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .mem-badge { font-size: 0.85rem; color: var(--label); font-family: 'Nunito Sans', sans-serif; font-weight: 700; }
  .pray-add { display: flex; gap: 8px; margin: 12px 0 8px; }
  .pray-input {
    flex: 1;
    font-family: inherit;
    font-size: 1rem;
    padding: 11px 18px;
    border-radius: 100px;
    border: 2px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    outline: none;
  }
  .pray-input::placeholder { color: var(--faint); }
  .pray-input:focus { border-color: var(--lime); }
  .pray-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dotted var(--line);
  }
  .pray-meta { font-size: 0.75rem; color: var(--soft); }
  .pray-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .pray-del {
    background: none;
    border: none;
    color: var(--faint);
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 8px;
  }
  .pray-del:hover { color: var(--tangerine); }
  @media print {
    .tabs, .datebar button, .footer-row, .readbtn, .note, header .sub,
    .pray-add, .pray-actions, .mem-controls, .progress-row, .retry-btn { display: none !important; }
    .pray-item, .pray-meta, .mem-chip { color: #111 !important; background: none; }
    body { background: #fff !important; color: #111; }
    header h1, .card h2, .quiz-q, .datebar .when .big { color: #111; }
    header h1 .cross, .theme-label, .verse-box .ref { color: #7a5b1e; }
    .card { background: #fff; box-shadow: none; border: none; padding: 0; color: #111; }
    .verse-box { background: #f1ede3; color: #111; }
    h3.section, .prayer, .readings .what, .readings-note, .streak { color: #555; }
    .activity { background: #faf6ea; border-color: #b8934a; }
  }
  @media (max-width: 480px) {
    .card { padding: 20px 16px; }
    header h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="theme-toggle" class="navbtn theme-toggle" onclick="toggleTheme()" title="Switch light/dark mode" aria-label="Switch light/dark mode"></button>
    <h1><span class="cross"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2.5h4V9h6.5v4H14v8.5h-4V13H3.5V9H10z"/></svg></span> Family Bible Study</h1>
    <div class="sub">"Your word is a lamp to my feet, and a light for my path." &mdash; Psalm 119:105</div>
  </header>

  <div class="tabs">
    <button id="tab-daily" class="active" onclick="showTab('daily')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.2 2.2M17.6 17.6l2.2 2.2M1 12h3M20 12h3M4.2 19.8l2.2-2.2M17.6 6.4l2.2-2.2"/></svg> Morning Study</button>
    <button id="tab-prayers" onclick="showTab('prayers')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c-1.2 1.8-2 2.9-2 4a2 2 0 0 0 4 0c0-1.1-.8-2.2-2-4z"/><rect x="9" y="10" width="6" height="9" rx="1"/><path d="M5 21h14"/></svg> Prayers</button>
    <button id="tab-weekly" onclick="showTab('weekly')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Couples Study</button>
  </div>

  <div id="view-daily">
    <div class="datebar">
      <button class="navbtn" onclick="moveDay(-1)">&larr;</button>
      <div class="when">
        <div class="big" id="daily-date"></div>
        <div class="small"><button class="navbtn todaybtn" onclick="goToday()">Jump to today</button></div>
      </div>
      <button class="navbtn" onclick="moveDay(1)">&rarr;</button>
    </div>
    <div class="card" id="daily-card"></div>
    <div class="card" id="kids-card"></div>
    <div class="card" id="memory-card"></div>
  </div>

  <div id="view-prayers" style="display:none">
    <div class="card" id="prayers-card"></div>
  </div>

  <div id="view-weekly" style="display:none">
    <div class="datebar">
      <button class="navbtn" onclick="moveWeek(-1)">&larr;</button>
      <div class="when">
        <div class="big" id="weekly-date"></div>
        <div class="small"><button class="navbtn todaybtn" onclick="goThisWeek()">Jump to this week</button></div>
      </div>
      <button class="navbtn" onclick="moveWeek(1)">&rarr;</button>
    </div>
    <div class="card" id="weekly-card"></div>
  </div>

  <div class="note">Scripture text: World English Bible (public domain). Verses load when online and are saved for offline use.</div>
</div>

<script src="daily.js"></script>
<script src="weekly.js"></script>
<script src="kids.js"></script>
<script src="memory.js"></script>
<script src="specials.js"></script>
<script>
// ---------- Date helpers ----------
const MS_DAY = 86400000;
let viewDate = new Date();           // date shown on the daily tab
let viewWeekOffset = 0;              // weeks from current week on couples tab

function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 1);
  return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - start) / MS_DAY) + 1;
}
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = (x.getDay() + 6) % 7;  // Monday = 0
  x.setDate(x.getDate() - dow);
  return x;
}
function weekNum(d) {
  const mon = mondayOf(d);
  return Math.floor((mon.getTime() - new Date(1970,0,5).getTime()) / (MS_DAY * 7));
}
const fmtLong = new Intl.DateTimeFormat('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
const fmtShort = new Intl.DateTimeFormat('en-US', { month:'short', day:'numeric' });

// ---------- Reading plan ----------
const NT_BOOKS = [["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],
  ["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],["Philippians",4],
  ["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],
  ["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],
  ["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]];
const NT_TOTAL = NT_BOOKS.reduce((s,b)=>s+b[1],0); // 260

function ntChapter(idx) {
  let i = ((idx % NT_TOTAL) + NT_TOTAL) % NT_TOTAL;
  for (const [book, ch] of NT_BOOKS) {
    if (i < ch) return book + ' ' + (i + 1);
    i -= ch;
  }
}
function readingsFor(d) {
  const doy = dayOfYear(d);
  const daysSinceEpoch = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(1970,0,1)) / MS_DAY);
  return {
    nt: ntChapter(daysSinceEpoch),
    psalm: 'Psalms ' + (((doy - 1) % 150) + 1),
    proverbs: 'Proverbs ' + Math.min(d.getDate(), 31)
  };
}

// ---------- Storage ----------
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }

function isDone(kind, key) { return !!(load('fbs.done.'+kind) || {})[key]; }
const MILESTONES = [3, 7, 14, 30, 50, 100, 200, 365];
function streakBadge(n) {
  if (n >= 365) return ' <span style="color:var(--label)">' + icon('crown', 'fill:currentColor') + '</span>';
  if (n >= 100) return ' <span style="color:#d4a017">' + icon('award') + '</span>';
  if (n >= 30) return ' <span style="color:#8f98a3">' + icon('award') + '</span>';
  if (n >= 7) return ' <span style="color:#b06c28">' + icon('award') + '</span>';
  return '';
}

// ---------- Theme ----------
function applyTheme(t) {
  document.body.classList.toggle('dark', t === 'dark');
  store('fbs.theme', t);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.innerHTML = icon(t === 'dark' ? 'sun' : 'moon');
  const meta = document.querySelector('meta[name="theme-color"]');

  if (!res.ok) throw new Error('fetch failed');

const _pverses = {}, _psel = {}, _pref = {};

function verseRangeLabel(verses, selSet) {
  const picked = [...selSet].sort((a, b) => a - b).map(i => verses[i]);

    : a.c === b.c ? a.c + ':' + a.v + '-' + b.v

  const parts = [];
  let start = null, prev = null;
  for (const v of picked) {
    if (prev && v.c === prev.c && v.v === prev.v + 1) { prev = v; continue; }

}
async function sharePassage(pid) {
  const verses = _pverses[pid], sel = _psel[pid], ref = _pref[pid];

  if (navigator.share) {
    try { await navigator.share({ text: text, title: label }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  let copied = false;

    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();

// ---------- Holiday specials ----------
function easterOf(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
function specialFor(d) {
  const m = d.getMonth() + 1, day = d.getDate(), y = d.getFullYear();
  if (m === 12 && day === 24) return SPECIALS.christmasEve;
  if (m === 12 && day === 25) return SPECIALS.christmas;
  if (m === 1 && day === 1) return SPECIALS.newYear;
  const e = easterOf(y);
  if (m === e.getMonth() + 1 && day === e.getDate()) return SPECIALS.easter;
  const gf = new Date(e); gf.setDate(gf.getDate() - 2);
  if (m === gf.getMonth() + 1 && day === gf.getDate()) return SPECIALS.goodFriday;
  if (m === 11 && d.getDay() === 4 && day >= 22 && day <= 28) return SPECIALS.thanksgiving;
  return null;
}

let _listenPending = false;
async function listenDaily() {

// ---------- Share verse as image ----------
async function shareVerse() {
  const s = window._currentDaily;
  let verse = '';
  try { verse = (await fetchPassage(s.ref)).replace(/\s+/g, ' ').trim(); } catch (e) { verse = s.ref; }
  const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1080;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 1080, 1080, 0);
  g.addColorStop(0, '#2c146c'); g.addColorStop(1, '#590083');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1080);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f7cc51';
  ctx.fillRect(526, 62, 28, 108);  // gold cross
  ctx.fillRect(492, 92, 96, 28);
  ctx.fillStyle = '#ffffff'; ctx.font = 'italic 44px Georgia';
  let lines = [], line = '';
  for (const w of ('“' + verse + '”').split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > 880) { lines.push(line); line = w; } else line = t;
  }
  lines.push(line);
  if (lines.length > 13) { lines = lines.slice(0, 13); lines[12] += ' …'; }
  const lh = 62;
  let y = 560 - (lines.length - 1) * lh / 2;
  for (const l of lines) { ctx.fillText(l, 540, y); y += lh; }
  ctx.fillStyle = '#f7cc51'; ctx.font = 'bold 38px Georgia';
  ctx.fillText('— ' + s.ref, 540, Math.min(y + 26, 970));
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '26px Georgia';
  ctx.fillText('Family Bible Study', 540, 1032);
  cv.toBlob(async blob => {
    const file = new File([blob], 'verse.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: s.ref }); return; } catch (e) {}
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'verse.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
}

// ---------- Memory verse of the week ----------
let memState = { week: null, level: 0, revealed: [] };
function memHidden(i) {
  const lv = memState.level;
  return lv === 3 || (lv === 2 && i % 3 !== 0) || (lv === 1 && i % 3 === 1);
}
function memLevel() {
  memState.level = (memState.level + 1) % 4;
  memState.revealed = [];

}
function memPeek(i) {
  if (!memState.revealed.includes(i)) memState.revealed.push(i);
  renderMemory();
}

}
function renderMemory() {

  const mv = MEMORY[((wn % MEMORY.length) + MEMORY.length) % MEMORY.length];

    <div class="mem-controls">

      ${memorized ? '' : '<button class="complete-btn" onclick="memGotIt()">I can say it! ' + icon('star', 'fill:currentColor') + '</button>'}
    </div>`;
  window._memRef = mv.ref;

  }).catch(() => {

}

  const idx = ((dayOfYear(d) - 1) + d.getFullYear() * 13) % DAILY.length;
  const sp = specialFor(d);
  const k = sp ? { quiz: sp.quiz, fun: sp.fun } : KIDS[idx % KIDS.length];
  const answers = load(kidsKey(d)) || {};
  const total = k.quiz.length;
  const answered = Object.keys(answers).length;
  const score = k.quiz.reduce((s, q, i) => s + (answers[i] === q.c ? 1 : 0), 0);

  let html = `
    <div class="theme-label">${icon('smile')} Kids Quiz</div>
    <h2>How Well Were You Listening?</h2>
    <div class="body-text readings-note">Three quick questions about today's study. Tap your answer!</div>`;

  k.quiz.forEach((q, qi) => {
    const chosen = answers[qi];
    html += `<div class="quiz-q"><span class="qnum">${qi + 1}</span>${esc(q.q)}</div><div class="opts">`;
    q.o.forEach((opt, oi) => {
      let cls = 'opt';
      if (chosen !== undefined) {
        if (oi === q.c) cls += ' correct';
        else if (oi === chosen) cls += ' wrong';
      }
      const mark = chosen !== undefined ? (oi === q.c ? ' ' + icon('check') : (oi === chosen ? ' ' + icon('x') : '')) : '';
      html += `<button class="${cls}" ${chosen !== undefined ? 'disabled' : ''} onclick="answerQuiz(${qi},${oi})">${esc(opt)}${mark}</button>`;
    });
    html += `</div>`;
  });

  if (answered === total) {
    const stars = Array.from({ length: total }, (_, i) =>
      icon('star', i < score ? 'color:#e5a812;fill:#f7cc51' : 'color:var(--faint)')
    ).join(' ');
    const cheer = score === total ? 'Perfect! You were really listening!' :
                  score >= total - 1 ? 'Great job — so close to perfect!' :
                  'Good try! Ask the family about the ones you missed.';
    html += `
      <div class="score-banner">
        <div class="stars">${stars}</div>
        <div>You got <b>${score} of ${total}</b>! ${cheer}</div>
        <button class="retry-btn" onclick="resetQuiz()">Try again</button>
      </div>`;
  }

  html += `
    <h3 class="section">Fun Challenge</h3>
    <div class="activity">${icon('target', 'color:var(--label)')} ${esc(k.fun)}</div>`;

  document.getElementById('kids-card').innerHTML = html;
}

function renderDaily() {
  const d = viewDate;
  const key = dateKey(d);
  const idx = ((dayOfYear(d) - 1) + d.getFullYear() * 13) % DAILY.length;
  const sp = specialFor(d);
  const s = sp || DAILY[idx];
  window._currentDaily = s;
  const r = readingsFor(d);
  const done = isDone('daily', key);
  const streak = dailyStreak();
  const daysSinceEpoch = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(1970,0,1)) / MS_DAY);
  const ntPct = Math.round(((daysSinceEpoch % NT_TOTAL) + NT_TOTAL) % NT_TOTAL / NT_TOTAL * 100);
  const psPct = Math.round(((dayOfYear(d) - 1) % 150) / 150 * 100);

  document.getElementById('daily-date').textContent = fmtLong.format(d);
  document.getElementById('daily-card').innerHTML = `
    <div class="theme-label">${sp ? icon('sparkle') + ' ' + esc(sp.label) : "Today's Theme"}</div>
    <h2>${esc(s.t)}</h2>
    <div class="verse-box">
      <span id="daily-verse">Loading verse…</span>
      <span class="ref">&mdash; ${esc(s.ref)} (WEB)</span>
    </div>
    <div class="body-text">${esc(s.body)}</div>
    <h3 class="section">Talk About It Together</h3>
    <ol class="questions">${s.q.map(q => '<li>' + esc(q) + '</li>').join('')}</ol>
    <h3 class="section">Today's Readings</h3>
    <p class="readings-note">One reading per age &mdash; each reader graduates to the next as they grow.</p>
    <ul class="readings">
      <li><span><b>${esc(r.proverbs)}</b> <span class="what">&mdash; ${icon('sprout')} Little ones (ages 4&ndash;8)</span></span> ${passageToggle(r.proverbs)}</li>
      <li><span><b>${esc(r.psalm)}</b> <span class="what">&mdash; ${icon('leaf')} Big kids (ages 9&ndash;12)</span></span> ${passageToggle(r.psalm)}</li>
      <li><span><b>${esc(r.nt)}</b> <span class="what">&mdash; ${icon('tree')} Teens &amp; adults</span></span> ${passageToggle(r.nt)}</li>
    </ul>
    <div class="progress-row"><span class="progress-label">New Testament journey</span><div class="bar"><div class="fill" style="width:${ntPct}%"></div></div><span class="progress-pct">${ntPct}%</span></div>
    <div class="progress-row"><span class="progress-label">Psalms journey</span><div class="bar"><div class="fill" style="width:${psPct}%"></div></div><span class="progress-pct">${psPct}%</span></div>
    <h3 class="section">Morning Prayer</h3>
    <p class="prayer">${esc(s.prayer)}</p>
    <div class="footer-row">
      <button class="complete-btn ${done ? 'done' : ''}" onclick="toggleDone('daily','${key}')">
        ${done ? icon('check') + ' Completed' : 'Mark Complete'}
      </button>
      <span class="streak"><span style="color:var(--tangerine)">${icon('flame')}</span> Streak: <b>${streak}</b> day${streak === 1 ? '' : 's'}${streakBadge(streak)}</span>
      <span class="toolrow">
        <button class="readbtn" onclick="listenDaily()">${icon('volume')} Listen</button>
        <button class="readbtn" onclick="shareVerse()">${icon('share')} Share</button>
        <button class="printbtn" onclick="window.print()">Print</button>
      </span>
    </div>`;
  verseSlot('daily-verse', s.ref);
}

function renderWeekly() {
  const wn = weekNum(new Date()) + viewWeekOffset;
  const mon = mondayOf(new Date());
  mon.setDate(mon.getDate() + viewWeekOffset * 7);
  const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
  const idx = ((wn % WEEKLY.length) + WEEKLY.length) % WEEKLY.length;
  const s = WEEKLY[idx];
  const key = 'w' + wn;
  const done = isDone('weekly', key);

  document.getElementById('weekly-date').textContent = 'Week of ' + fmtShort.format(mon) + ' – ' + fmtShort.format(sun) + ', ' + sun.getFullYear();
  document.getElementById('weekly-card').innerHTML = `
    <div class="theme-label">This Week for the Two of You</div>
    <h2>${esc(s.t)}</h2>
    <div class="verse-box">
      <span id="weekly-verse">Loading passage…</span>
      <span class="ref">&mdash; ${esc(s.ref)} (WEB)</span>
    </div>
    <div class="body-text">${esc(s.intro)}</div>
    <h3 class="section">Read Together</h3>
    <ul class="readings">
      <li><span><b>${esc(s.ref)}</b></span> ${passageToggle(s.ref)}</li>
    </ul>
    <h3 class="section">Talk It Through</h3>
    <ol class="questions">${s.q.map(q => '<li>' + esc(q) + '</li>').join('')}</ol>
    <h3 class="section">This Week's Practice</h3>
    <div class="activity">${esc(s.act)}</div>
    <h3 class="section">Pray Together</h3>
    <p class="prayer">${esc(s.prayer)}</p>
    <div class="footer-row">
      <button class="complete-btn ${done ? 'done' : ''}" onclick="toggleDone('weekly','${key}')">
        ${done ? icon('check') + ' Completed' : 'Mark Complete'}
      </button>
      <button class="printbtn" onclick="window.print()">Print</button>
    </div>`;
  verseSlot('weekly-verse', s.ref);
}

applyTheme(load('fbs.theme') || 'light');
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
