<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Bible Study</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#49067c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #2c146c;
    --bg2: #590083;
    --deep: #29093d;
    --card: rgba(255,255,255,0.07);
    --ink: #ffffff;
    --soft: #dfa5f7;
    --lime: #dbe65b;
    --banana: #f7cc51;
    --turquoise: #0ab1b4;
    --tangerine: #e73722;
    --green: #3cb847;
    --line: rgba(255,255,255,0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito Sans', 'Avenir Next', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(350deg, var(--bg1), var(--bg2)) fixed;
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 60px; }

  header {
    text-align: center;
    padding: 34px 16px 18px;
  }
  header h1 {
    font-family: 'Montserrat', 'Nunito Sans', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.3px;
  }
  header h1 .cross { color: var(--banana); }
  header .sub {
    color: var(--soft);
    font-size: 0.9rem;
    margin-top: 6px;
  }

  .tabs {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 14px 0 24px;
  }
  .tabs button {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 11px 22px;
    border: 2px solid var(--line);
    border-radius: 100px;
    background: rgba(255,255,255,0.06);
    color: #fff;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .tabs button:hover { border-color: var(--lime); }
  .tabs button.active {
    background: var(--lime);
    border-color: var(--lime);
    color: var(--deep);
  }

  .datebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 8px;
  }
  .datebar .when { text-align: center; flex: 1; }
  .datebar .when .big { font-size: 1.05rem; font-weight: 700; color: #fff; }
  .datebar .when .small { font-size: 0.8rem; color: var(--soft); }
  .navbtn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    border: 2px solid var(--line);
    background: rgba(255,255,255,0.06);
    color: #fff;
    border-radius: 100px;
    padding: 6px 16px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .navbtn:hover { border-color: var(--lime); }
  .todaybtn { font-size: 0.8rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 28px 26px 24px;
    box-shadow: 0 10px 34px rgba(12,2,9,0.35);
    margin-bottom: 18px;
  }
  .theme-label {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--banana);
    margin-bottom: 4px;
  }
  .card h2 {
    font-family: 'Montserrat', 'Nunito Sans', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: #fff;
    margin-bottom: 14px;
  }
  .verse-box {
    background: linear-gradient(135deg, rgba(121,86,236,0.9), rgba(47,185,248,0.9));
    border-radius: 18px;
    padding: 18px 20px;
    margin: 14px 0;
    font-style: italic;
  }
  .verse-box .ref {
    display: block;
    font-style: normal;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--banana);
    margin-top: 8px;
  }
  .body-text { margin: 14px 0; }
  h3.section {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--soft);
    margin: 22px 0 8px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 5px;
    font-weight: 800;
  }
  ol.questions { padding-left: 22px; }
  ol.questions li { margin-bottom: 9px; }
  .prayer {
    font-style: italic;
    color: var(--soft);
  }
  .readings-note {
    font-size: 0.82rem;
    font-style: italic;
    color: var(--soft);
    margin-bottom: 6px;
  }
  .readings { list-style: none; }
  .readings li {
    padding: 10px 0;
    border-bottom: 1px dotted var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .readings li:last-child { border-bottom: none; }
  .readings .what { color: var(--soft); font-size: 0.85rem; }
  .readbtn {
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    border: 2px solid var(--turquoise);
    background: none;
    color: #fff;
    border-radius: 100px;
    padding: 4px 14px;
    cursor: pointer;
    transition: background .15s;
  }
  .readbtn:hover { background: var(--turquoise); color: var(--deep); }
  .passage-text {
    display: none;
    width: 100%;
    background: rgba(12,2,9,0.3);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 8px;
    font-size: 0.95rem;
    white-space: pre-line;
  }
  .activity {
    background: rgba(247,204,81,0.12);
    border: 2px dashed var(--banana);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 8px 0;
  }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 10px;
  }
  .complete-btn {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    padding: 11px 24px;
    border-radius: 100px;
    border: 2px solid var(--lime);
    background: var(--lime);
    color: var(--deep);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .complete-btn.done {
    background: transparent;
    color: var(--lime);
  }
  .streak {
    font-size: 0.85rem;
    color: var(--soft);
  }
  .streak b { color: var(--banana); }
  .printbtn {
    font-family: inherit;
    font-size: 0.8rem;
    border: none;
    background: none;
    color: var(--soft);
    cursor: pointer;
    text-decoration: underline;
  }
  .note {
    text-align: center;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.55);
    font-style: italic;
    margin-top: 8px;
  }
  .quiz-q { margin: 18px 0 10px; font-weight: 800; }
  .quiz-q .qnum {
    display: inline-block;
    background: var(--turquoise);
    color: #fff;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    line-height: 24px;
    text-align: center;
    font-size: 0.85rem;
    margin-right: 8px;
    font-weight: 700;
  }
  .opts { display: flex; flex-direction: column; gap: 8px; margin-left: 32px; }
  .opt {
    font-family: inherit;
    font-size: 1rem;
    text-align: left;
    padding: 11px 16px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    cursor: pointer;
    transition: border-color .15s;
  }
  .opt:hover { border-color: var(--lime); }
  .opt.correct { background: var(--green); border-color: var(--green); color: #fff; }
  .opt.wrong { background: var(--tangerine); border-color: var(--tangerine); color: #fff; }
  .opt:disabled { cursor: default; opacity: 0.75; }
  .opt.correct:disabled, .opt.wrong:disabled { opacity: 1; }
  .score-banner {
    text-align: center;
    background: rgba(247,204,81,0.15);
    border: 2px solid var(--banana);
    border-radius: 18px;
    padding: 14px;
    margin: 20px 0 6px;
    font-size: 1.1rem;
  }
  .score-banner .stars { font-size: 1.5rem; letter-spacing: 4px; }
  .retry-btn {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    margin-top: 8px;
    border: 2px solid var(--line);
    background: none;
    color: #fff;
    border-radius: 100px;
    padding: 5px 16px;
    cursor: pointer;
  }
  .retry-btn:hover { border-color: var(--lime); }
  .confetti-piece {
    position: fixed;
    top: -40px;
    z-index: 999;
    pointer-events: none;
    animation: conffall 2.9s linear forwards;
  }
  @keyframes conffall {
    to { transform: translateY(110vh) rotate(540deg); opacity: 0.5; }
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--soft);
  }
  .progress-row .progress-label { min-width: 150px; }
  .progress-row .bar {
    flex: 1;
    height: 8px;
    border-radius: 100px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  .progress-row .fill {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, var(--turquoise), var(--lime));
  }
  .toolrow { display: flex; gap: 8px; align-items: center; }
  .mem-words { margin: 12px 0 4px; line-height: 2.2; }
  .mem-chip {
    display: inline-block;
    margin: 2px;
    padding: 5px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
  }
  .mem-chip.veiled {
    background: rgba(12,2,9,0.4);
    color: var(--soft);
    cursor: pointer;
    letter-spacing: 1px;
    border: 1px dashed var(--line);
  }
  .mem-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .mem-badge { font-size: 0.85rem; color: var(--banana); font-family: 'Nunito Sans', sans-serif; font-weight: 700; }
  .pray-add { display: flex; gap: 8px; margin: 12px 0 8px; }
  .pray-input {
    flex: 1;
    font-family: inherit;
    font-size: 1rem;
    padding: 11px 18px;
    border-radius: 100px;
    border: 2px solid var(--line);
    background: rgba(255,255,255,0.08);
    color: #fff;
    outline: none;
  }
  .pray-input::placeholder { color: rgba(255,255,255,0.45); }
  .pray-input:focus { border-color: var(--lime); }
  .pray-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dotted var(--line);
  }
  .pray-meta { font-size: 0.75rem; color: var(--soft); }
  .pray-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .pray-del {
    background: none;
    border: none;
    color: rgba(255,255,255,0.45);
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 8px;
  }
  .pray-del:hover { color: var(--tangerine); }
  @media print {
    .tabs, .datebar button, .footer-row, .readbtn, .note, header .sub,
    .pray-add, .pray-actions, .mem-controls, .progress-row, .retry-btn { display: none !important; }
    .pray-item, .pray-meta, .mem-chip { color: #111 !important; background: none; }
    body { background: #fff !important; color: #111; }
    header h1, .card h2, .quiz-q, .datebar .when .big { color: #111; }
    header h1 .cross, .theme-label, .verse-box .ref { color: #7a5b1e; }
    .card { background: #fff; box-shadow: none; border: none; padding: 0; color: #111; }
    .verse-box { background: #f1ede3; color: #111; }
    h3.section, .prayer, .readings .what, .readings-note, .streak { color: #555; }
    .activity { background: #faf6ea; border-color: #b8934a; }
  }
  @media (max-width: 480px) {
    .card { padding: 20px 16px; }
    header h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="cross">&#10013;</span> Family Bible Study</h1>
    <div class="sub">"Your word is a lamp to my feet, and a light for my path." &mdash; Psalm 119:105</div>
  </header>

  <div class="tabs">
    <button id="tab-daily" class="active" onclick="showTab('daily')">&#9728;&#65039; Morning Study</button>
    <button id="tab-kids" onclick="showTab('kids')">&#129490; Kids Quiz</button>
    <button id="tab-prayers" onclick="showTab('prayers')">&#128591; Prayers</button>
    <button id="tab-weekly" onclick="showTab('weekly')">&#128149; Couples Study</button>
  </div>

  <div id="view-daily">
    <div class="datebar">
      <button class="navbtn" onclick="moveDay(-1)">&larr;</button>
      <div class="when">
        <div class="big" id="daily-date"></div>
        <div class="small"><button class="navbtn todaybtn" onclick="goToday()">Jump to today</button></div>
      </div>
      <button class="navbtn" onclick="moveDay(1)">&rarr;</button>
    </div>
    <div class="card" id="daily-card"></div>
    <div class="card" id="memory-card"></div>
  </div>

  <div id="view-prayers" style="display:none">
    <div class="card" id="prayers-card"></div>
  </div>

  <div id="view-kids" style="display:none">
    <div class="datebar">
      <button class="navbtn" onclick="moveDay(-1)">&larr;</button>
      <div class="when">
        <div class="big" id="kids-date"></div>
        <div class="small"><button class="navbtn todaybtn" onclick="goToday()">Jump to today</button></div>
      </div>
      <button class="navbtn" onclick="moveDay(1)">&rarr;</button>
    </div>
    <div class="card" id="kids-card"></div>
  </div>

  <div id="view-weekly" style="display:none">
    <div class="datebar">
      <button class="navbtn" onclick="moveWeek(-1)">&larr;</button>
      <div class="when">
        <div class="big" id="weekly-date"></div>
        <div class="small"><button class="navbtn todaybtn" onclick="goThisWeek()">Jump to this week</button></div>
      </div>
      <button class="navbtn" onclick="moveWeek(1)">&rarr;</button>
    </div>
    <div class="card" id="weekly-card"></div>
  </div>

  <div class="note">Scripture text: World English Bible (public domain). Verses load when online and are saved for offline use.</div>
</div>

<script src="daily.js"></script>
<script src="weekly.js"></script>
<script src="kids.js"></script>
<script src="memory.js"></script>
<script src="specials.js"></script>
<script>
// ---------- Date helpers ----------
const MS_DAY = 86400000;
let viewDate = new Date();           // date shown on the daily tab
let viewWeekOffset = 0;              // weeks from current week on couples tab

function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 1);
  return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - start) / MS_DAY) + 1;
}
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = (x.getDay() + 6) % 7;  // Monday = 0
  x.setDate(x.getDate() - dow);
  return x;
}
function weekNum(d) {
  const mon = mondayOf(d);
  return Math.floor((mon.getTime() - new Date(1970,0,5).getTime()) / (MS_DAY * 7));
}
const fmtLong = new Intl.DateTimeFormat('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
const fmtShort = new Intl.DateTimeFormat('en-US', { month:'short', day:'numeric' });

// ---------- Reading plan ----------
const NT_BOOKS = [["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],
  ["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],["Philippians",4],
  ["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],
  ["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],
  ["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]];
const NT_TOTAL = NT_BOOKS.reduce((s,b)=>s+b[1],0); // 260

function ntChapter(idx) {
  let i = ((idx % NT_TOTAL) + NT_TOTAL) % NT_TOTAL;
  for (const [book, ch] of NT_BOOKS) {
    if (i < ch) return book + ' ' + (i + 1);
    i -= ch;
  }
}
function readingsFor(d) {
  const doy = dayOfYear(d);
  const daysSinceEpoch = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(1970,0,1)) / MS_DAY);
  return {
    nt: ntChapter(daysSinceEpoch),
    psalm: 'Psalms ' + (((doy - 1) % 150) + 1),
    proverbs: 'Proverbs ' + Math.min(d.getDate(), 31)
  };
}

// ---------- Storage ----------
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }

function isDone(kind, key) { return !!(load('fbs.done.'+kind) || {})[key]; }
const MILESTONES = [3, 7, 14, 30, 50, 100, 200, 365];
function streakBadge(n) {
  return n >= 365 ? ' 👑' : n >= 100 ? ' 🥇' : n >= 30 ? ' 🥈' : n >= 7 ? ' 🥉' : '';
}
function toggleDone(kind, key) {
  const m = load('fbs.done.'+kind) || {};
  if (m[key]) delete m[key]; else m[key] = true;
  store('fbs.done.'+kind, m);
  if (kind === 'daily' && m[key] && MILESTONES.includes(dailyStreak())) confetti();
  render();
}
function confetti() {
  const EMO = ['🎉','⭐','✨','🙌','💛'];
  for (let i = 0; i < 36; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = EMO[i % EMO.length];
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    el.style.fontSize = (16 + Math.random() * 22) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3400);
  }
}
function dailyStreak() {
  const m = load('fbs.done.daily') || {};
  let n = 0;
  let d = new Date();
  if (!m[dateKey(d)]) d.setDate(d.getDate() - 1); // today not done yet doesn't break streak
  while (m[dateKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- Scripture fetching (WEB translation, cached) ----------
async function fetchPassage(ref) {
  const key = 'fbs.verse.' + ref;
  const cached = load(key);
  if (cached) return cached;
  const res = await fetch('https://bible-api.com/' + encodeURIComponent(ref) + '?translation=web');
  if (!res.ok) throw new Error('fetch failed');
  const data = await res.json();
  const text = (data.text || '').trim().replace(/\n{2,}/g, '\n');
  store(key, text);
  return text;
}
const _slotRef = {};
function verseSlot(id, ref) {
  _slotRef[id] = ref;
  fetchPassage(ref).then(text => {
    const el = document.getElementById(id);
    if (el && _slotRef[id] === ref) el.textContent = '“' + text.replace(/\s+/g,' ').trim() + '”';
  }).catch(() => {
    const el = document.getElementById(id);
    if (el && _slotRef[id] === ref) el.textContent = 'Open your Bible to ' + ref + ' and read it aloud together.';
  });
}
let passageCounter = 0;
function passageToggle(ref) {
  const pid = 'passage-' + (passageCounter++);
  return `<button class="readbtn" onclick="togglePassage('${pid}', '${ref.replace(/'/g,"\\'")}')">Show text</button>
          <div class="passage-text" id="${pid}"></div>`;
}
function togglePassage(pid, ref) {
  const el = document.getElementById(pid);
  if (el.style.display === 'block') { el.style.display = 'none'; return; }
  el.style.display = 'block';
  if (!el.textContent) {
    el.textContent = 'Loading…';
    fetchPassage(ref).then(t => { el.textContent = t; })
      .catch(() => { el.textContent = 'Could not load (offline?). Read ' + ref + ' in your Bible.'; });
  }
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// ---------- Rendering ----------
function showTab(which) {
  for (const t of ['daily', 'kids', 'prayers', 'weekly']) {
    document.getElementById('view-' + t).style.display = t === which ? '' : 'none';
    document.getElementById('tab-' + t).classList.toggle('active', t === which);
  }
}
function moveDay(n) { viewDate.setDate(viewDate.getDate() + n); render(); }
function goToday() { viewDate = new Date(); render(); }
function moveWeek(n) { viewWeekOffset += n; render(); }
function goThisWeek() { viewWeekOffset = 0; render(); }

function render() {
  passageCounter = 0;
  renderDaily();
  renderMemory();
  renderKids();
  renderPrayers();
  renderWeekly();
}

// ---------- Holiday specials ----------
function easterOf(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
function specialFor(d) {
  const m = d.getMonth() + 1, day = d.getDate(), y = d.getFullYear();
  if (m === 12 && day === 24) return SPECIALS.christmasEve;
  if (m === 12 && day === 25) return SPECIALS.christmas;
  if (m === 1 && day === 1) return SPECIALS.newYear;
  const e = easterOf(y);
  if (m === e.getMonth() + 1 && day === e.getDate()) return SPECIALS.easter;
  const gf = new Date(e); gf.setDate(gf.getDate() - 2);
  if (m === gf.getMonth() + 1 && day === gf.getDate()) return SPECIALS.goodFriday;
  if (m === 11 && d.getDay() === 4 && day >= 22 && day <= 28) return SPECIALS.thanksgiving;
  return null;
}

// ---------- Read aloud ----------
let _listenPending = false;
async function listenDaily() {
  if (window.speechSynthesis && speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
  const s = window._currentDaily;
  if (!s || !window.speechSynthesis || _listenPending) return;
  _listenPending = true;
  setTimeout(() => { _listenPending = false; }, 1500);
  let verse = '';
  try { verse = await fetchPassage(s.ref); } catch (e) {}
  const text = [s.t + '.', verse, s.body, 'Questions to talk about.',
    ...s.q.map((q, i) => 'Question ' + (i + 1) + '. ' + q),
    'Morning prayer. ' + s.prayer].join('\n');
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

// ---------- Share verse as image ----------
async function shareVerse() {
  const s = window._currentDaily;
  let verse = '';
  try { verse = (await fetchPassage(s.ref)).replace(/\s+/g, ' ').trim(); } catch (e) { verse = s.ref; }
  const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1080;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 1080, 1080, 0);
  g.addColorStop(0, '#2c146c'); g.addColorStop(1, '#590083');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1080);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f7cc51'; ctx.font = '70px Georgia';
  ctx.fillText('✝', 540, 150);
  ctx.fillStyle = '#ffffff'; ctx.font = 'italic 44px Georgia';
  let lines = [], line = '';
  for (const w of ('“' + verse + '”').split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > 880) { lines.push(line); line = w; } else line = t;
  }
  lines.push(line);
  if (lines.length > 13) { lines = lines.slice(0, 13); lines[12] += ' …'; }
  const lh = 62;
  let y = 560 - (lines.length - 1) * lh / 2;
  for (const l of lines) { ctx.fillText(l, 540, y); y += lh; }
  ctx.fillStyle = '#f7cc51'; ctx.font = 'bold 38px Georgia';
  ctx.fillText('— ' + s.ref, 540, Math.min(y + 26, 970));
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '26px Georgia';
  ctx.fillText('Family Bible Study', 540, 1032);
  cv.toBlob(async blob => {
    const file = new File([blob], 'verse.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: s.ref }); return; } catch (e) {}
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'verse.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
}

// ---------- Memory verse of the week ----------
let memState = { week: null, level: 0, revealed: [] };
function memHidden(i) {
  const lv = memState.level;
  return lv === 3 || (lv === 2 && i % 3 !== 0) || (lv === 1 && i % 3 === 1);
}
function memLevel() {
  memState.level = (memState.level + 1) % 4;
  memState.revealed = [];
  renderMemory();
}
function memPeek(i) {
  if (!memState.revealed.includes(i)) memState.revealed.push(i);
  renderMemory();
}
function memGotIt() {
  const m = load('fbs.mem') || {};
  m['w' + memState.week] = true;
  store('fbs.mem', m);
  confetti();
  renderMemory();
}
function renderMemory() {
  const wn = weekNum(viewDate);
  if (memState.week !== wn) memState = { week: wn, level: 0, revealed: [] };
  const mv = MEMORY[((wn % MEMORY.length) + MEMORY.length) % MEMORY.length];
  const memorized = !!(load('fbs.mem') || {})['w' + wn];
  const el = document.getElementById('memory-card');
  el.innerHTML = `
    <div class="theme-label">⭐ Memory Verse of the Week</div>
    <h2>${esc(mv.t)} ${memorized ? '<span class="mem-badge">⭐ Memorized!</span>' : ''}</h2>
    <div class="body-text readings-note">Practice all week: hide more words each time until you can say it by heart. Tap a hidden word to peek.</div>
    <div class="mem-words" id="mem-words">Loading verse…</div>
    <div class="verse-box" style="padding:10px 16px"><span class="ref" style="margin-top:0">— ${esc(mv.ref)} (WEB)</span></div>
    <div class="mem-controls">
      <button class="readbtn" onclick="memLevel()">${memState.level === 3 ? 'Show it again' : 'Hide ' + (memState.level === 0 ? 'some' : 'more') + ' words'}</button>
      ${memorized ? '' : '<button class="complete-btn" onclick="memGotIt()">I can say it! ⭐</button>'}
    </div>`;
  window._memRef = mv.ref;
  fetchPassage(mv.ref).then(t => {
    if (window._memRef !== mv.ref) return; // a newer week's verse is now showing
    const words = t.replace(/\s+/g, ' ').trim().split(' ');
    const box = document.getElementById('mem-words');
    if (!box) return;
    box.innerHTML = words.map((w, i) =>
      memHidden(i) && !memState.revealed.includes(i)
        ? `<button class="mem-chip veiled" onclick="memPeek(${i})">${esc(w[0])}${'·'.repeat(Math.min(Math.max(w.length - 1, 1), 6))}</button>`
        : `<span class="mem-chip">${esc(w)}</span>`
    ).join('');
  }).catch(() => {
    const box = document.getElementById('mem-words');
    if (box) box.textContent = 'Open your Bible to ' + mv.ref + ' — then come practice here when you\'re back online.';
  });
}

// ---------- Prayers of the week ----------
function weeksSince(iso) {
  return Math.floor((Date.now() - new Date(iso).getTime()) / (MS_DAY * 7));
}
function addPrayer() {
  const input = document.getElementById('pray-input');
  const text = (input.value || '').trim();
  if (!text) return;
  const prayers = load('fbs.prayers') || [];
  prayers.push({ id: String(Date.now()), text: text, created: new Date().toISOString(), answered: null });
  store('fbs.prayers', prayers);
  renderPrayers();
}
function answerPrayer(id) {
  const prayers = load('fbs.prayers') || [];
  const p = prayers.find(p => p.id === id);
  if (p) { p.answered = new Date().toISOString(); store('fbs.prayers', prayers); confetti(); }
  renderPrayers();
}
function removePrayer(id) {
  if (!confirm('Remove this prayer from the list?')) return;
  store('fbs.prayers', (load('fbs.prayers') || []).filter(p => p.id !== id));
  renderPrayers();
}
function renderPrayers() {
  const prayers = load('fbs.prayers') || [];
  const active = prayers.filter(p => !p.answered);
  const answered = prayers.filter(p => p.answered).sort((a, b) => b.answered.localeCompare(a.answered));
  const mon = mondayOf(new Date());
  const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
  document.getElementById('prayers-card').innerHTML = `
    <div class="theme-label">🙏 Prayers of the Week</div>
    <h2>What We're Praying For</h2>
    <div class="body-text readings-note">Week of ${fmtShort.format(mon)} – ${fmtShort.format(sun)}. Prayers carry over every week until God answers — then check them off and watch the answered list grow.</div>
    <div class="pray-add">
      <input id="pray-input" class="pray-input" maxlength="200" placeholder="Add something to pray for…" onkeydown="if(event.key==='Enter')addPrayer()">
      <button class="complete-btn" onclick="addPrayer()">Add</button>
    </div>
    <h3 class="section">Praying this week (${active.length})</h3>
    ${active.length ? active.map(p => {
      const w = weeksSince(p.created);
      return `
      <div class="pray-item">
        <div class="pray-text">${esc(p.text)}
          <div class="pray-meta">praying since ${fmtShort.format(new Date(p.created))}${w >= 1 ? ' · ' + w + ' week' + (w > 1 ? 's' : '') + ' and counting' : ''}</div>
        </div>
        <div class="pray-actions">
          <button class="readbtn" onclick="answerPrayer('${p.id}')">✓ Answered!</button>
          <button class="pray-del" onclick="removePrayer('${p.id}')" title="Remove">✕</button>
        </div>
      </div>`; }).join('') : '<p class="readings-note">Nothing here yet — add your first prayer above.</p>'}
    <h3 class="section">Answered prayers (${answered.length}) 🎉</h3>
    ${answered.length ? answered.map(p => `
      <div class="pray-item">
        <div class="pray-text">✅ ${esc(p.text)}
          <div class="pray-meta">asked ${fmtShort.format(new Date(p.created))} → answered ${fmtShort.format(new Date(p.answered))}</div>
        </div>
      </div>`).join('') : '<p class="readings-note">Answered prayers collect here — your family\'s story of God\'s faithfulness.</p>'}`;
}

// ---------- Kids quiz ----------
function kidsKey(d) { return 'fbs.kids.' + dateKey(d); }
function answerQuiz(qi, oi) {
  const answers = load(kidsKey(viewDate)) || {};
  if (answers[qi] !== undefined) return; // already answered
  answers[qi] = oi;
  store(kidsKey(viewDate), answers);
  renderKids();
}
function resetQuiz() {
  try { localStorage.removeItem(kidsKey(viewDate)); } catch(e) {}
  renderKids();
}
function renderKids() {
  const d = viewDate;
  const idx = ((dayOfYear(d) - 1) + d.getFullYear() * 13) % DAILY.length;
  const sp = specialFor(d);
  const theme = sp || DAILY[idx];
  const k = sp ? { quiz: sp.quiz, fun: sp.fun } : KIDS[idx % KIDS.length];
  const answers = load(kidsKey(d)) || {};
  const total = k.quiz.length;
  const answered = Object.keys(answers).length;
  const score = k.quiz.reduce((s, q, i) => s + (answers[i] === q.c ? 1 : 0), 0);

  document.getElementById('kids-date').textContent = fmtLong.format(d);

  let html = `
    <div class="theme-label">Kids Quiz &mdash; Today's Theme</div>
    <h2>${esc(theme.t)}</h2>
    <div class="body-text">Listen to the morning study first, then see how many you can get right. Tap your answer!</div>`;

  k.quiz.forEach((q, qi) => {
    const chosen = answers[qi];
    html += `<div class="quiz-q"><span class="qnum">${qi + 1}</span>${esc(q.q)}</div><div class="opts">`;
    q.o.forEach((opt, oi) => {
      let cls = 'opt';
      if (chosen !== undefined) {
        if (oi === q.c) cls += ' correct';
        else if (oi === chosen) cls += ' wrong';
      }
      const mark = chosen !== undefined ? (oi === q.c ? ' ✓' : (oi === chosen ? ' ✗' : '')) : '';
      html += `<button class="${cls}" ${chosen !== undefined ? 'disabled' : ''} onclick="answerQuiz(${qi},${oi})">${esc(opt)}${mark}</button>`;
    });
    html += `</div>`;
  });

  if (answered === total) {
    const stars = '⭐'.repeat(score) + '☆'.repeat(total - score);
    const cheer = score === total ? 'Perfect! You were really listening!' :
                  score >= total - 1 ? 'Great job — so close to perfect!' :
                  'Good try! Ask the family about the ones you missed.';
    html += `
      <div class="score-banner">
        <div class="stars">${stars}</div>
        <div>You got <b>${score} of ${total}</b>! ${cheer}</div>
        <button class="retry-btn" onclick="resetQuiz()">Try again</button>
      </div>`;
  }

  html += `
    <h3 class="section">Fun Challenge</h3>
    <div class="activity">&#127919; ${esc(k.fun)}</div>`;

  document.getElementById('kids-card').innerHTML = html;
}

function renderDaily() {
  const d = viewDate;
  const key = dateKey(d);
  const idx = ((dayOfYear(d) - 1) + d.getFullYear() * 13) % DAILY.length;

  const done = isDone('daily', key);

  const ntPct = Math.round(((daysSinceEpoch % NT_TOTAL) + NT_TOTAL) % NT_TOTAL / NT_TOTAL * 100);

  document.getElementById('daily-date').textContent = fmtLong.format(d);

    <div class="theme-label">${sp ? '✨ ' + esc(sp.label) : "Today's Theme"}</div>
    <h2>${esc(s.t)}</h2>
    <div class="verse-box">
      <span id="daily-verse">Loading verse…</span>

    <ul class="readings">
      <li><span><b>${esc(r.proverbs)}</b> <span class="what">&mdash; &#127793; Little ones (ages 4&ndash;8)</span></span> ${passageToggle(r.proverbs)}</li>
      <li><span><b>${esc(r.psalm)}</b> <span class="what">&mdash; &#127807; Big kids (ages 9&ndash;12)</span></span> ${passageToggle(r.psalm)}</li>
      <li><span><b>${esc(r.nt)}</b> <span class="what">&mdash; &#127795; Teens &amp; adults</span></span> ${passageToggle(r.nt)}</li>
    </ul>
    <div class="progress-row"><span class="progress-label">New Testament journey</span><div class="bar"><div class="fill" style="width:${ntPct}%"></div></div><span class="progress-pct">${ntPct}%</span></div>
    <div class="progress-row"><span class="progress-label">Psalms journey</span><div class="bar"><div class="fill" style="width:${psPct}%"></div></div><span class="progress-pct">${psPct}%</span></div>
    <h3 class="section">Morning Prayer</h3>
    <p class="prayer">${esc(s.prayer)}</p>
    <div class="footer-row">
      <button class="complete-btn ${done ? 'done' : ''}" onclick="toggleDone('daily','${key}')">
        ${done ? '✓ Completed' : 'Mark Complete'}
      </button>
      <span class="streak">&#128293; Streak: <b>${streak}</b> day${streak === 1 ? '' : 's'}${streakBadge(streak)}</span>
      <span class="toolrow">
        <button class="readbtn" onclick="listenDaily()">🔊 Listen</button>
        <button class="readbtn" onclick="shareVerse()">📤 Share</button>
        <button class="printbtn" onclick="window.print()">Print</button>
      </span>
    </div>`;
  verseSlot('daily-verse', s.ref);
}

function renderWeekly() {
  const wn = weekNum(new Date()) + viewWeekOffset;

render();
